name: Build Portal for iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Mac Build Dependencies
        run: |
          brew install sdl2 freetype fontconfig pkg-config jpeg libpng curl

      - name: Forge Empty Mock Headers
        run: |
          mkdir -p mock_headers/OpenGL
          # We make these empty because our force_gl.h will already contain everything. 
          # This prevents "file not found" errors if the engine explicitly asks for them.
          touch mock_headers/OpenGL/gl.h
          touch mock_headers/OpenGL/glext.h
          touch mock_headers/OpenGL/glcorearb.h

      - name: Create the Nuclear Force-Include Header
        run: |
          # Download Mesa's robust OpenGL headers which contain literally every GL constant and type
          curl -sL https://gitlab.freedesktop.org/mesa/mesa/-/raw/main/include/GL/gl.h -o mesa_gl.h
          curl -sL https://gitlab.freedesktop.org/mesa/mesa/-/raw/main/include/GL/glext.h -o mesa_glext.h
          
          # Build the ultimate force_include file
          cat << 'EOF' > force_gl.h
          #ifndef FORCE_APPLE_GL_H
          #define FORCE_APPLE_GL_H
          
          #include <stdint.h>
          #include <stddef.h>
          
          // Temporarily hide the Apple flag so Mesa doesn't skip Desktop GL features
          #ifdef __APPLE__
          #define HIDDEN_APPLE
          #undef __APPLE__
          #endif
          EOF
          
          # Violently inject the thousands of lines of official Mesa OpenGL definitions
          cat mesa_gl.h >> force_gl.h
          cat mesa_glext.h >> force_gl.h
          
          # Restore Apple flags and add ToGL's custom overrides
          cat << 'EOF' >> force_gl.h
          
          // Restore the Apple flag for the rest of the Apple iOS SDK
          #ifdef HIDDEN_APPLE
          #define __APPLE__ 1
          #endif
          
          // Ensure ToGL's 64-bit and API macros are satisfied
          #define APIENTRY
          #define GL_APIENTRY
          #define GL_APIENTRYP *
          typedef uint64_t GLuint64;
          typedef int64_t GLint64;
          
          #endif
          EOF

      - name: Create iOS Dummy Libraries
        run: |
          mkdir -p mock_libs
          cd mock_libs
          
          echo "void mock_function(){}" > mock.c
          xcrun --sdk iphoneos clang -arch arm64 -c mock.c -o mock.o
          
          xcrun ar rcs libfreetype.a mock.o
          xcrun ar rcs libfreetype2.a mock.o
          xcrun ar rcs libfontconfig.a mock.o
          xcrun ar rcs libSDL2.a mock.o
          xcrun ar rcs libSDL2main.a mock.o
          xcrun ar rcs libjpeg.a mock.o
          xcrun ar rcs libpng.a mock.o
          xcrun ar rcs libpng16.a mock.o
          xcrun ar rcs libcurl.a mock.o
          xcrun ar rcs libgl4es.a mock.o
          cd ..

      - name: Configure Waf for Portal (iOS)
        run: |
          export CXXFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export CFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export LINKFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          export LDFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
          
          python3 waf configure -T release --ios --build-games=portal --disable-warns --skip-sdl2-sanity-check

      - name: Compile the Engine
        run: |
          export CXXFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export CFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export LINKFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          export LDFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          
          python3 waf build -p -v

      - name: Package the Binaries
        run: |
          python3 waf install --destdir=./portal_ios_build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Portal-iOS-Binaries
          path: ./portal_ios_build/
