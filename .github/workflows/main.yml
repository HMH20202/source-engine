name: Build Portal (iOS)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    name: Compile Portal for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Xcode Environment
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Dependencies
        run: |
          brew update
          brew install pkg-config freetype

      - name: Configure Waf for Portal
        run: python3 waf configure -T release --build-games=portal --ios

      - name: Compile Engine Binaries
        run: python3 waf build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portal-ios-binaries
          path: build/
          if-no-files-found: warn
