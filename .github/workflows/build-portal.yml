name: Build Portal for iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Mac Build Dependencies
        run: |
          brew install sdl2 freetype fontconfig pkg-config jpeg libpng curl

      - name: Forge OpenGL Headers for iOS
        run: |
          mkdir -p mock_headers/OpenGL mock_headers/EGL mock_headers/KHR
          
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git mock_gl4es
          cp -r mock_gl4es/include/GL/* mock_headers/OpenGL/
          
          curl -sL https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/EGL/egl.h -o mock_headers/EGL/egl.h
          curl -sL https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/EGL/eglext.h -o mock_headers/EGL/eglext.h
          curl -sL https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/EGL/eglplatform.h -o mock_headers/EGL/eglplatform.h
          curl -sL https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/KHR/khrplatform.h -o mock_headers/KHR/khrplatform.h
          curl -sL https://raw.githubusercontent.com/google/angle/main/include/EGL/eglext_angle.h -o mock_headers/EGL/eglext_angle.h

      - name: Create Force-Include Header
        run: |
          cat << 'EOF' > force_gl.h
          #ifndef FORCE_APPLE_GL_H
          #define FORCE_APPLE_GL_H
          
          #include <stdint.h>
          #include <stddef.h>
          
          typedef unsigned int GLenum;
          typedef unsigned char GLboolean;
          typedef unsigned int GLbitfield;
          typedef signed char GLbyte;
          typedef short GLshort;
          typedef int GLint;
          typedef int GLsizei;
          typedef unsigned char GLubyte;
          typedef unsigned short GLushort;
          typedef unsigned int GLuint;
          typedef float GLfloat;
          typedef float GLclampf;
          typedef double GLdouble;
          typedef double GLclampd;
          typedef void GLvoid;
          typedef char GLchar;
          typedef ptrdiff_t GLsizeiptr;
          typedef intptr_t GLintptr;
          
          typedef uint64_t GLuint64;
          typedef int64_t GLint64;
          
          typedef unsigned int GLhandleARB;
          typedef char GLcharARB;
          typedef ptrdiff_t GLsizeiptrARB;
          typedef intptr_t GLintptrARB;
          
          #define GL_BYTE 0x1400
          #define GL_UNSIGNED_BYTE 0x1401
          #define GL_SHORT 0x1402
          #define GL_UNSIGNED_SHORT 0x1403
          #define GL_INT 0x1404
          #define GL_UNSIGNED_INT 0x1405
          #define GL_FLOAT 0x1406
          #define GL_HALF_FLOAT 0x140B
          
          #define GL_NEAREST 0x2600
          #define GL_LINEAR 0x2601
          #define GL_NEAREST_MIPMAP_NEAREST 0x2700
          #define GL_LINEAR_MIPMAP_NEAREST 0x2701
          #define GL_NEAREST_MIPMAP_LINEAR 0x2702
          #define GL_LINEAR_MIPMAP_LINEAR 0x2703
          
          #define GL_NONE 0x0000
          #define GL_TEXTURE_BORDER_COLOR 0x1004
          #define GL_TEXTURE_MIN_LOD 0x813A
          #define GL_TEXTURE_LOD_BIAS 0x8501
          #define GL_TEXTURE_COMPARE_MODE_ARB 0x884C
          #define GL_TEXTURE_COMPARE_FUNC_ARB 0x884D
          #define GL_COMPARE_R_TO_TEXTURE_ARB 0x884E
          
          #define GL_REPEAT 0x2901
          #define GL_CLAMP_TO_EDGE 0x812F
          #define GL_CLAMP_TO_BORDER 0x812D
          #define GL_TEXTURE_WRAP_S 0x2802
          #define GL_TEXTURE_WRAP_T 0x2803
          #define GL_TEXTURE_WRAP_R 0x8072
          #define GL_TEXTURE_MIN_FILTER 0x2801
          #define GL_TEXTURE_MAG_FILTER 0x2800
          #define GL_TEXTURE_MAX_ANISOTROPY_EXT 0x84FE
          
          #define GL_FALSE 0
          #define GL_TRUE 1
          #define GL_CULL_FACE 0x0B44
          #define GL_FRONT_FACE 0x0B46
          #define GL_CW 0x0900
          #define GL_CCW 0x0901
          #define GL_FRONT 0x0404
          #define GL_BACK 0x0405
          #define GL_FRONT_AND_BACK 0x0408
          
          #define GL_ALPHA_TEST 0x0BC0
          #define GL_ALPHA_TEST_FUNC 0x0BC1
          #define GL_ALPHA_TEST_REF 0x0BC2
          #define GL_SAMPLE_ALPHA_TO_COVERAGE_ARB 0x809E
          #define GL_POLYGON_MODE 0x0B40
          #define GL_POLYGON_OFFSET_FILL 0x8037
          #define GL_POLYGON_OFFSET_FACTOR 0x8038
          #define GL_POLYGON_OFFSET_UNITS 0x2A00
          #define GL_SCISSOR_TEST 0x0C11
          #define GL_SCISSOR_BOX 0x0C10
          #define GL_VIEWPORT 0x0BA2
          #define GL_DEPTH_RANGE 0x0B70
          
          #define GL_DEPTH_TEST 0x0B71
          #define GL_DEPTH_WRITEMASK 0x0B72
          #define GL_DEPTH_CLEAR_VALUE 0x0B73
          #define GL_DEPTH_FUNC 0x0B74
          #define GL_NEVER 0x0200
          #define GL_LESS 0x0201
          #define GL_EQUAL 0x0202
          #define GL_LEQUAL 0x0203
          #define GL_GREATER 0x0204
          #define GL_NOTEQUAL 0x0205
          #define GL_GEQUAL 0x0206
          #define GL_ALWAYS 0x0207
          #define GL_BLEND 0x0BE2
          #define GL_BLEND_COLOR 0x8005
          #define GL_BLEND_SRC 0x0BE1
          #define GL_BLEND_DST 0x0BE0
          #define GL_BLEND_EQUATION 0x8009
          #define GL_FUNC_ADD 0x8006
          #define GL_FUNC_SUBTRACT 0x800A
          #define GL_FUNC_REVERSE_SUBTRACT 0x800B
          #define GL_MIN 0x8007
          #define GL_MAX 0x8008
          #define GL_ZERO 0
          #define GL_ONE 1
          #define GL_SRC_COLOR 0x0300
          #define GL_ONE_MINUS_SRC_COLOR 0x0301
          #define GL_SRC_ALPHA 0x0302
          #define GL_ONE_MINUS_SRC_ALPHA 0x0303
          #define GL_DST_ALPHA 0x0304
          #define GL_ONE_MINUS_DST_ALPHA 0x0305
          #define GL_DST_COLOR 0x0306
          #define GL_ONE_MINUS_DST_COLOR 0x0307
          #define GL_SRC_ALPHA_SATURATE 0x0308
          #define GL_COLOR_CLEAR_VALUE 0x0C22
          #define GL_COLOR_WRITEMASK 0x0C23
          #define GL_STENCIL_CLEAR_VALUE 0x0B91
          #define GL_STENCIL_WRITEMASK 0x0B98
          #define GL_STENCIL_TEST 0x0B90
          #define GL_STENCIL_FUNC 0x0B92
          #define GL_STENCIL_VALUE_MASK 0x0B93
          #define GL_STENCIL_FAIL 0x0B94
          #define GL_STENCIL_PASS_DEPTH_FAIL 0x0B95
          #define GL_STENCIL_PASS_DEPTH_PASS 0x0B96
          #define GL_STENCIL_REF 0x0B97
          #define GL_KEEP 0x1E00
          #define GL_REPLACE 0x1E01
          #define GL_INCR 0x1E02
          #define GL_DECR 0x1E03
          #define GL_INVERT 0x150A
          #define GL_INCR_WRAP 0x8507
          #define GL_DECR_WRAP 0x8508
          #define GL_INCR_WRAP_EXT 0x8507
          #define GL_DECR_WRAP_EXT 0x8508
          #define GL_COLOR_BUFFER_BIT 0x4000
          #define GL_DEPTH_BUFFER_BIT 0x0100
          #define GL_STENCIL_BUFFER_BIT 0x0400
          
          #define GL_STENCIL_BACK_FUNC 0x8800
          #define GL_STENCIL_BACK_FAIL 0x8801
          #define GL_STENCIL_BACK_PASS_DEPTH_FAIL 0x8802
          #define GL_STENCIL_BACK_PASS_DEPTH_PASS 0x8803
          #define GL_FRAMEBUFFER_EXT 0x8D40
          #define GL_READ_FRAMEBUFFER_EXT 0x8CA8
          #define GL_DRAW_FRAMEBUFFER_EXT 0x8CA9
          #define GL_RENDERBUFFER_EXT 0x8D41
          #define GL_COLOR_ATTACHMENT0_EXT 0x8CE0
          #define GL_DEPTH_ATTACHMENT_EXT 0x8D00
          #define GL_STENCIL_ATTACHMENT_EXT 0x8D20
          #define GL_ARRAY_BUFFER_ARB 0x8892
          #define GL_ELEMENT_ARRAY_BUFFER_ARB 0x8893
          #define GL_TEXTURE0 0x84C0
          
          #define GL_NO_ERROR 0
          #define GL_VENDOR 0x1F00
          #define GL_RENDERER 0x1F01
          #define GL_VERSION 0x1F02
          #define GL_EXTENSIONS 0x1F03
          #define GL_FRAMEBUFFER_BINDING 0x8CA6
          
          #define GL_PROGRAM_INSTRUCTIONS_ARB 0x880B
          #define GL_MAX_PROGRAM_INSTRUCTIONS_ARB 0x88A1
          #define GL_PROGRAM_NATIVE_INSTRUCTIONS_ARB 0x880A
          #define GL_MAX_PROGRAM_NATIVE_INSTRUCTIONS_ARB 0x88A2
          #define GL_PROGRAM_TEMPORARIES_ARB 0x880F
          #define GL_MAX_PROGRAM_TEMPORARIES_ARB 0x88A5
          #define GL_PROGRAM_NATIVE_TEMPORARIES_ARB 0x880E
          #define GL_MAX_PROGRAM_NATIVE_TEMPORARIES_ARB 0x88A6
          #define GL_PROGRAM_PARAMETERS_ARB 0x8809
          #define GL_MAX_PROGRAM_PARAMETERS_ARB 0x88A9
          #define GL_PROGRAM_NATIVE_PARAMETERS_ARB 0x8808
          #define GL_MAX_PROGRAM_NATIVE_PARAMETERS_ARB 0x88AA
          #define GL_PROGRAM_ATTRIBUTES_ARB 0x880D
          #define GL_MAX_PROGRAM_ATTRIBUTES_ARB 0x88AB
          #define GL_PROGRAM_NATIVE_ATTRIBUTES_ARB 0x880C
          #define GL_MAX_PROGRAM_NATIVE_ATTRIBUTES_ARB 0x88AC
          #define GL_PROGRAM_ADDRESS_REGISTERS_ARB 0x8807
          #define GL_MAX_PROGRAM_ADDRESS_REGISTERS_ARB 0x88AD
          #define GL_PROGRAM_NATIVE_ADDRESS_REGISTERS_ARB 0x8806
          #define GL_MAX_PROGRAM_NATIVE_ADDRESS_REGISTERS_ARB 0x88AE
          #define GL_PROGRAM_ALU_INSTRUCTIONS_ARB 0x8805
          #define GL_MAX_PROGRAM_ALU_INSTRUCTIONS_ARB 0x882D
          #define GL_PROGRAM_NATIVE_ALU_INSTRUCTIONS_ARB 0x8804
          #define GL_MAX_PROGRAM_NATIVE_ALU_INSTRUCTIONS_ARB 0x882E
          #define GL_PROGRAM_TEX_INSTRUCTIONS_ARB 0x8803
          #define GL_MAX_PROGRAM_TEX_INSTRUCTIONS_ARB 0x882F
          #define GL_PROGRAM_NATIVE_TEX_INSTRUCTIONS_ARB 0x8802
          #define GL_MAX_PROGRAM_NATIVE_TEX_INSTRUCTIONS_ARB 0x8830
          #define GL_PROGRAM_TEX_INDIRECTIONS_ARB 0x8801
          #define GL_MAX_PROGRAM_TEX_INDIRECTIONS_ARB 0x8831
          #define GL_PROGRAM_NATIVE_TEX_INDIRECTIONS_ARB 0x8800
          #define GL_MAX_PROGRAM_NATIVE_TEX_INDIRECTIONS_ARB 0x8832
          
          #define GL_SAMPLES_PASSED_ARB 0x8914
          #define GL_QUERY_RESULT_ARB 0x8866
          #define GL_QUERY_RESULT_AVAILABLE_ARB 0x8867
          
          #define GL_STATIC_DRAW_ARB 0x88E4
          #define GL_DYNAMIC_DRAW_ARB 0x88E8
          #define GL_WRITE_ONLY_ARB 0x88B9
          #define GL_BUFFER_SERIALIZED_MODIFY_APPLE 0x8A12
          #define GL_BUFFER_FLUSHING_UNMAP_APPLE 0x8A13
          #define GL_EXTERNAL_VIRTUAL_MEMORY_BUFFER_AMD 0x9160
          
          #define GL_PIXEL_UNPACK_BUFFER_ARB 0x88EC
          #define GL_PIXEL_PACK_BUFFER_ARB 0x88EB
          
          // --- GOD MODE: BRUTE FORCE EVERYTHING ELSE ---
          
          // Primitives
          #define GL_POINTS 0x0000
          #define GL_LINES 0x0001
          #define GL_LINE_LOOP 0x0002
          #define GL_LINE_STRIP 0x0003
          #define GL_TRIANGLES 0x0004
          #define GL_TRIANGLE_STRIP 0x0005
          #define GL_TRIANGLE_FAN 0x0006
          #define GL_QUADS 0x0007
          #define GL_QUAD_STRIP 0x0008
          #define GL_POLYGON 0x0009
          
          // Clip Planes
          #define GL_CLIP_PLANE0 0x3000
          #define GL_CLIP_PLANE1 0x3001
          #define GL_CLIP_PLANE2 0x3002
          #define GL_CLIP_PLANE3 0x3003
          #define GL_CLIP_PLANE4 0x3004
          #define GL_CLIP_PLANE5 0x3005
          
          // State Machine
          #define GL_DONT_CARE 0x1100
          #define GL_DITHER 0x0BD0
          
          // Standard VBO Hints
          #define GL_STREAM_DRAW 0x88E0
          #define GL_STREAM_READ 0x88E1
          #define GL_STREAM_COPY 0x88E2
          #define GL_STATIC_DRAW 0x88E4
          #define GL_STATIC_READ 0x88E5
          #define GL_STATIC_COPY 0x88E6
          #define GL_DYNAMIC_DRAW 0x88E8
          #define GL_DYNAMIC_READ 0x88E9
          #define GL_DYNAMIC_COPY 0x88EA
          
          // Textures & Cube Maps
          #define GL_TEXTURE_1D 0x0DE0
          #define GL_TEXTURE_2D 0x0DE1
          #define GL_TEXTURE_3D 0x806F
          #define GL_TEXTURE_CUBE_MAP 0x8513
          #define GL_TEXTURE_BINDING_CUBE_MAP 0x8514
          #define GL_TEXTURE_CUBE_MAP_POSITIVE_X 0x8515
          #define GL_TEXTURE_CUBE_MAP_NEGATIVE_X 0x8516
          #define GL_TEXTURE_CUBE_MAP_POSITIVE_Y 0x8517
          #define GL_TEXTURE_CUBE_MAP_NEGATIVE_Y 0x8518
          #define GL_TEXTURE_CUBE_MAP_POSITIVE_Z 0x8519
          #define GL_TEXTURE_CUBE_MAP_NEGATIVE_Z 0x851A
          #define GL_MAX_CUBE_MAP_TEXTURE_SIZE 0x851C
          
          // FBO Status and Attachments
          #define GL_FRAMEBUFFER_COMPLETE_EXT 0x8CD5
          #define GL_FRAMEBUFFER_INCOMPLETE_ATTACHMENT_EXT 0x8CD6
          #define GL_FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT_EXT 0x8CD7
          #define GL_FRAMEBUFFER_INCOMPLETE_DIMENSIONS_EXT 0x8CD9
          #define GL_FRAMEBUFFER_INCOMPLETE_FORMATS_EXT 0x8CDA
          #define GL_FRAMEBUFFER_INCOMPLETE_DRAW_BUFFER_EXT 0x8CDB
          #define GL_FRAMEBUFFER_INCOMPLETE_READ_BUFFER_EXT 0x8CDC
          #define GL_FRAMEBUFFER_UNSUPPORTED_EXT 0x8CDD
          #define GL_COLOR_ATTACHMENT1_EXT 0x8CE1
          #define GL_COLOR_ATTACHMENT2_EXT 0x8CE2
          #define GL_COLOR_ATTACHMENT3_EXT 0x8CE3
          #define GL_COLOR_ATTACHMENT4_EXT 0x8CE4
          
          // Legacy & Compressed Pixel Formats
          #define GL_ALPHA 0x1906
          #define GL_RGB 0x1907
          #define GL_RGBA 0x1908
          #define GL_LUMINANCE 0x1909
          #define GL_LUMINANCE_ALPHA 0x190A
          #define GL_BGRA 0x80E1
          #define GL_DEPTH_COMPONENT 0x1902
          #define GL_DEPTH_STENCIL_EXT 0x84F9
          #define GL_COMPRESSED_RGB_S3TC_DXT1_EXT 0x83F0
          #define GL_COMPRESSED_RGBA_S3TC_DXT3_EXT 0x83F2
          #define GL_COMPRESSED_RGBA_S3TC_DXT5_EXT 0x83F3
          
          // Debug Output
          #define GL_DEBUG_SOURCE_API_ARB 0x8246
          #define GL_DEBUG_SOURCE_WINDOW_SYSTEM_ARB 0x8247
          #define GL_DEBUG_SOURCE_SHADER_COMPILER_ARB 0x8248
          #define GL_DEBUG_SOURCE_THIRD_PARTY_ARB 0x8249
          #define GL_DEBUG_SOURCE_APPLICATION_ARB 0x824A
          #define GL_DEBUG_SOURCE_OTHER_ARB 0x824B
          #define GL_DEBUG_TYPE_ERROR_ARB 0x824C
          #define GL_DEBUG_TYPE_DEPRECATED_BEHAVIOR_ARB 0x824D
          #define GL_DEBUG_TYPE_UNDEFINED_BEHAVIOR_ARB 0x824E
          #define GL_DEBUG_TYPE_PORTABILITY_ARB 0x824F
          #define GL_DEBUG_TYPE_PERFORMANCE_ARB 0x8250
          #define GL_DEBUG_TYPE_OTHER_ARB 0x8251
          #define GL_DEBUG_SEVERITY_HIGH_ARB 0x9146
          #define GL_DEBUG_SEVERITY_MEDIUM_ARB 0x9147
          #define GL_DEBUG_SEVERITY_LOW_ARB 0x9148
          
          extern void* l_gl4es;
          typedef void* (*t_glGetProcAddress)(const char*);
          extern t_glGetProcAddress _glGetProcAddress;
          
          #define APIENTRY
          #define GL_APIENTRY
          #define GL_APIENTRYP *
          
          #endif
          EOF

      - name: Create iOS Dummy Libraries
        run: |
          mkdir -p mock_libs
          cd mock_libs
          
          echo "void mock_function(){}" > mock.c
          xcrun --sdk iphoneos clang -arch arm64 -c mock.c -o mock.o
          
          xcrun ar rcs libfreetype.a mock.o
          xcrun ar rcs libfreetype2.a mock.o
          xcrun ar rcs libfontconfig.a mock.o
          xcrun ar rcs libSDL2.a mock.o
          xcrun ar rcs libSDL2main.a mock.o
          xcrun ar rcs libjpeg.a mock.o
          xcrun ar rcs libpng.a mock.o
          xcrun ar rcs libpng16.a mock.o
          xcrun ar rcs libcurl.a mock.o
          xcrun ar rcs libgl4es.a mock.o
          cd ..

      - name: Configure Waf for Portal (iOS)
        run: |
          export CXXFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export CFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export LINKFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          export LDFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
          
          python3 waf configure -T release --ios --build-games=portal --disable-warns --skip-sdl2-sanity-check

      - name: Compile the Engine
        run: |
          export CXXFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export CFLAGS="-I$PWD/mock_headers -I/opt/homebrew/include -I/opt/homebrew/include/freetype2 -I/opt/homebrew/include/SDL2 -include $PWD/force_gl.h"
          export LINKFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          export LDFLAGS="-L$PWD/mock_libs -Wl,-undefined,dynamic_lookup"
          
          python3 waf build -p -v

      - name: Package the Binaries
        run: |
          python3 waf install --destdir=./portal_ios_build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Portal-iOS-Binaries
          path: ./portal_ios_build/
