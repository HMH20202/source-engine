name: Build Portal (iOS)

# This allows you to manually trigger the build from the Actions tab
on:
  workflow_dispatch: 

jobs:
  build-ios:
    name: Compile Portal for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Apple relies on Xcode command line tools to compile C++ for ARM64
      - name: Setup Xcode Environment
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Configure Waf for Portal
        run: |
          # Configuring the build system. 
          # The critical flag here is --build-games=portal
          python3 waf configure -T release --build-games=portal --ios

      - name: Compile Engine Binaries
        run: |
          # This is where the actual C++ compilation happens.
          # It may take up to 45 minutes on a GitHub runner.
          python3 waf build

      - name: Upload Build Artifacts
        # If it successfully compiles, this grabs the output files (like client.dylib and server.dylib)
        uses: actions/upload-artifact@v4
        with:
          name: portal-ios-binaries
          path: build/ # The standard waf output directory
          if-no-files-found: warn
